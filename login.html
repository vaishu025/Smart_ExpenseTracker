{% extends 'base.html' %}
{% block title %}Login - Smart Expense Tracker{% endblock %}

{% block content %}
<div class="card auth-card">
    <div class="text-center mb-3">
        <i class="bi bi-wallet2 text-primary" style="font-size: 2.5rem;"></i>
        <h3 class="mt-2 mb-0">Welcome Back</h3>
        <p class="text-muted">Login to manage your expenses</p>
    </div>

    <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}
        <div class="mb-3">
            <label class="form-label" for="id_username">Username</label>
            <input type="text" name="username" class="form-control" id="id_username" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="id_password">Password</label>
            <input type="password" name="password" class="form-control" id="id_password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login
        </button>
    </form>

    <p class="text-center mt-3 mb-0">
        Don't have an account? <a href="{% url 'register' %}">Register here</a>
    </p>
</div>
{% endblock %}
